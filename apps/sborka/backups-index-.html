<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- App mode: fixed viewport, no pinch/double-tap zoom вЂ” behaves like a native app -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Сборка">
  <meta name="theme-color" content="#f4f6f9">
  <title>FBS Сборка</title>
  <link rel="manifest" href="/sborka/manifest.webmanifest">
  <link rel="icon" href="/sborka/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/sborka/icon.svg">
  <script>
    // iOS Safari ignores user-scalable=no since iOS 10 вЂ” block pinch/double-tap zoom explicitly.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    var __lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - __lastTouchEnd <= 300) e.preventDefault();
      __lastTouchEnd = now;
    }, { passive: false });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sborka/css/terminal.css?v=20260401-proxy-auth-v1">
  <link rel="stylesheet" href="/sborka/css/style1-theme.css?v=20260412-default-methods-v1">
  <!-- bembox theme is INLINED so a flaky network can never drop it back to the dark theme.
       Source of truth: css/bembox-theme.css. After editing it, regenerate index.html:
       python scripts/inline_theme.py -->
  <style id="bembox-theme">
/* ==========================================================================
   bembox theme for «FBS Сборка»  —  light admin style (Onest + coral)
   Loaded LAST, overrides terminal.css + style1-theme.css design tokens.
   Visual only: no markup / logic changes. Palette mirrors bembox admin panel.
   Author: Claude, 2026-07-29.
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap');

:root {
  /* --- bembox brand palette --- */
  --bem-coral: #ff7547;
  --bem-coral-deep: #f0581f;
  --bem-coral-soft: #ffe6da;
  --bem-ink: #0f172a;
  --bem-ink-2: #475569;
  --bem-mute: #64748b;
  --bem-mute-soft: #94a3b8;
  --bem-bg: #f4f6f9;
  --bem-surface: #ffffff;
  --bem-surface-sub: #f8fafc;
  --bem-line: #e6ebf1;
  --bem-line-soft: #eff2f6;
  --bem-navy: #0c1322;
  --bem-shadow-card: 0 1px 2px -1px rgba(15, 23, 42, .06), 0 2px 5px -2px rgba(15, 23, 42, .05);
  --bem-shadow-pop: 0 10px 30px -10px rgba(15, 23, 42, .20), 0 2px 8px -3px rgba(15, 23, 42, .10);
  --bem-shadow-lift: 0 8px 24px -10px rgba(15, 23, 42, .18), 0 2px 6px -2px rgba(15, 23, 42, .08);

  /* --- remap terminal.css tokens --- */
  --bg: var(--bem-bg);
  --surface: var(--bem-surface);
  --surface-hover: var(--bem-surface-sub);
  --border: var(--bem-line);
  --border-hover: #d7dee8;
  --text: var(--bem-ink);
  --text-secondary: var(--bem-ink-2);
  --text-muted: var(--bem-mute);
  --muted: var(--bem-mute);
  --accent: var(--bem-coral);
  --accent-dim: var(--bem-coral-deep);
  --accent-bg: rgba(255, 117, 71, .10);
  --error: #ef4444;  --error-bg: rgba(239, 68, 68, .10);
  --warning: #f59e0b; --warning-bg: rgba(245, 158, 11, .12);
  --info: #3b82f6;   --info-bg: rgba(59, 130, 246, .10);
  --font-sans: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --radius: 10px;

  /* --- remap style1-theme.css tokens --- */
  --bg-primary: var(--bem-bg);
  --bg-secondary: var(--bem-surface);
  --bg-tertiary: var(--bem-surface-sub);
  --bg-card: var(--bem-surface);
  --border-color: var(--bem-line);
  --text-primary: var(--bem-ink);
  --accent-green: #10b981; --accent-green-hover: #059669;
  --accent-blue: var(--bem-coral); --accent-blue-hover: var(--bem-coral-deep);
  --accent-cyan: #3b82f6;
  --status-new: #10b981;
  --badge-bg: var(--bem-line-soft);
  --table-row-hover: var(--bem-surface-sub);
  --link-color: var(--bem-coral-deep);
  --shadow-sm: var(--bem-shadow-card);
  --shadow-md: var(--bem-shadow-pop);
  --radius-sm: 8px; --radius-md: 10px; --radius-lg: 12px;
  --wb-accent: #ff7547; --wb-accent-dim: #f0581f; --wb-accent-soft: #ffb69a; --wb-accent-bg: rgba(255, 117, 71, .12);
  --stats-oz-accent: #3b82f6;
}

/* ---------- base ---------- */
html, body {
  background: var(--bem-bg);
  color: var(--bem-ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { letter-spacing: .1px; }

/* gentle global transitions for a snappy, polished feel */
a, button, .btn, .tab, .nav-tab, .marketplace-tile, .card, .surface, .pill, .chip,
.input, input, select, textarea, .tbl tbody tr, .global-setting-row {
  transition: background-color .16s ease, border-color .16s ease, color .12s ease,
              box-shadow .18s ease, transform .12s ease;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- light scrollbars ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid var(--bem-bg); }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
* { scrollbar-color: #cbd5e1 transparent; }

/* ---------- entrance animations ---------- */
@keyframes bemFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes bemFade   { from { opacity: 0; } to { opacity: 1; } }
/* Entrance animation ONLY on rarely re-rendered screens. The shell rebuilds the
   DOM on every poll/click, so animating .card/.modal made the whole UI pulse
   («дёргается»). Frequently re-rendered blocks get no entrance animation. */
.login-card, .marketplace-select-panel {
  animation: bemFadeUp .28s ease both;
}

/* ---------- topbar ---------- */
.topbar {
  background: var(--bem-surface) !important;
  border-bottom: 1px solid var(--bem-line) !important;
  height: 48px !important;
  box-shadow: var(--bem-shadow-card);
}
.topbar-brand {
  color: var(--bem-coral) !important;
  letter-spacing: .3px !important;
  text-transform: none !important;
  font-weight: 800 !important;
  font-size: 15px !important;
}
.topbar-user { color: var(--bem-ink-2) !important; font-weight: 600; }
.topbar-role { color: var(--bem-mute) !important; }

/* ---------- login ---------- */
.login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(1100px 520px at 50% -8%, rgba(255, 117, 71, .10), transparent 60%),
    var(--bem-bg) !important;
  padding: 24px;
}
.login-card {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 16px !important;
  box-shadow: var(--bem-shadow-pop) !important;
  padding: 32px 30px !important;
  width: min(400px, 100%);
}
.login-title {
  color: var(--bem-ink) !important;
  font-weight: 800 !important;
  font-size: 22px !important;
  letter-spacing: -.2px;
}
.login-subtitle { color: var(--bem-mute) !important; }
.login-card .btn-primary { width: 100%; justify-content: center; }

/* ---------- marketplace hub (landing) ---------- */
.marketplace-select-screen {
  min-height: calc(100vh - 48px);
  display: flex; align-items: center; justify-content: center;
  padding: 32px !important;
}
.marketplace-select-panel {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 16px !important;
  box-shadow: var(--bem-shadow-pop) !important;
  padding: 26px !important;
}
.marketplace-select-head { color: var(--bem-ink); }
.marketplace-select-grid { gap: 16px !important; }
.marketplace-tile {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 14px !important;
  box-shadow: var(--bem-shadow-card);
  color: var(--bem-ink) !important;
  padding: 20px !important;
  min-height: 168px !important;
}
.marketplace-tile:hover {
  border-color: var(--bem-coral) !important;
  background: var(--bem-surface) !important;
  box-shadow: var(--bem-shadow-lift) !important;
  transform: translateY(-2px);
}
.marketplace-tile strong { color: var(--bem-ink) !important; font-weight: 800 !important; letter-spacing: -.3px; }
.marketplace-tile span { color: var(--bem-mute) !important; }
.marketplace-tile-kicker {
  font-size: 11px !important; font-weight: 700 !important; letter-spacing: .6px;
}
.marketplace-tile-wb .marketplace-tile-kicker { color: var(--bem-coral) !important; }
.marketplace-tile-oz .marketplace-tile-kicker { color: #3b82f6 !important; }
.marketplace-tile-settings .marketplace-tile-kicker { color: #10b981 !important; }

/* Center the tiles for any count: admin sees 2 (Ozon + WB), super sees 3 (+ Настройки). */
.marketplace-select-grid {
  display: flex !important;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px !important;
}
.marketplace-select-grid > .marketplace-tile {
  flex: 0 0 280px;
}

/* ---------- nicer <select> (custom chevron instead of the native "2000s" arrow) ---------- */
select,
select.input,
.store-input,
.store-select select {
  -webkit-appearance: none !important;
  -moz-appearance: none !important;
  appearance: none !important;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") !important;
  background-repeat: no-repeat !important;
  background-position: right 10px center !important;
  padding-right: 30px !important;
  cursor: pointer;
}

/* ---------- tabs / nav ---------- */
.tabs, .nav-tabs { border-bottom: 1px solid var(--bem-line) !important; }
.tab, .nav-tab { color: var(--bem-mute) !important; font-weight: 600; }
.tab:hover, .nav-tab:hover { color: var(--bem-ink) !important; }
.tab.active, .nav-tab.active {
  color: var(--bem-coral-deep) !important;
  border-bottom-color: var(--bem-coral) !important;
}
.tab-badge, .nav-tab .badge { background: var(--bem-line-soft) !important; color: var(--bem-ink-2) !important; }
.nav-tab .badge.new, .tab-badge.new { background: var(--bem-coral-soft) !important; color: var(--bem-coral-deep) !important; }

/* ---------- buttons ---------- */
.btn {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  color: var(--bem-ink-2) !important;
  border-radius: 9px !important;
  font-weight: 600 !important;
  font-family: var(--font-sans) !important;
}
.btn:hover:not(:disabled) { background: var(--bem-line-soft) !important; border-color: var(--border-hover) !important; color: var(--bem-ink) !important; }
.btn-primary {
  background: linear-gradient(180deg, #ff8358 0%, #f0581f 100%) !important;
  border: 1px solid var(--bem-coral-deep) !important;
  color: #fff !important;
  box-shadow: 0 4px 12px -4px rgba(240, 88, 31, .5) !important;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.04); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .6 !important; }
.btn-danger { background: var(--error) !important; border-color: var(--error) !important; color: #fff !important; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.05); }
.btn-secondary { background: var(--bem-surface) !important; border: 1px solid var(--bem-line) !important; color: var(--bem-ink-2) !important; }
.btn-secondary:hover { background: var(--bem-line-soft) !important; }
.btn-blue { background: #3b82f6 !important; border-color: #3b82f6 !important; color: #fff !important; }

/* ---------- cards / surfaces / panels ---------- */
.card, .surface, .panel, .stat-card, .kpi-card {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 12px !important;
  box-shadow: var(--bem-shadow-card) !important;
}

/* ---------- tables ---------- */
.tbl { font-size: 13px; }
.tbl thead th {
  background: var(--bem-surface-sub) !important;
  color: var(--bem-mute) !important;
  text-transform: uppercase; letter-spacing: .4px; font-size: 10.5px !important; font-weight: 700 !important;
  border-bottom: 1px solid var(--bem-line) !important;
}
.tbl tbody td { border-bottom: 1px solid var(--bem-line-soft) !important; color: var(--bem-ink); }
.tbl tbody tr:hover { background: var(--bem-surface-sub) !important; }

/* ---------- inputs ---------- */
.input, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select, textarea {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  color: var(--bem-ink) !important;
  border-radius: 9px !important;
  font-family: var(--font-sans) !important;
}
.input::placeholder, input::placeholder { color: var(--bem-mute-soft) !important; }
.input:focus, input:focus, select:focus, textarea:focus {
  outline: none !important;
  border-color: var(--bem-coral) !important;
  box-shadow: 0 0 0 3px rgba(255, 117, 71, .18) !important;
}
.field > label, .field-label, label { color: var(--bem-ink-2); font-weight: 600; }

/* ---------- pills / chips / badges / status dots ---------- */
.pill, .chip, .badge {
  border-radius: 999px !important;
  border: 1px solid var(--bem-line) !important;
  background: var(--bem-surface-sub) !important;
  color: var(--bem-ink-2) !important;
  font-weight: 600;
}
.pill.active, .chip.active { color: var(--bem-coral-deep) !important; border-color: var(--bem-coral) !important; background: var(--bem-coral-soft) !important; }

/* ---------- alerts ---------- */
.alert { border-radius: 10px !important; border: 1px solid var(--bem-line); }
.alert-error { background: var(--error-bg) !important; color: #b42318 !important; border-color: rgba(239, 68, 68, .28) !important; }
.alert-success { background: rgba(16, 185, 129, .10) !important; color: #067647 !important; border-color: rgba(16, 185, 129, .28) !important; }
.alert-warning { background: var(--warning-bg) !important; color: #b54708 !important; border-color: rgba(245, 158, 11, .30) !important; }

/* ---------- modal ---------- */
.modal-overlay, .overlay { background: rgba(15, 23, 42, .38) !important; backdrop-filter: blur(2px); }
.modal {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 16px !important;
  box-shadow: var(--bem-shadow-pop) !important;
  color: var(--bem-ink);
}
.modal-tab.active { color: var(--bem-coral-deep) !important; border-bottom-color: var(--bem-coral) !important; }

/* ---------- global settings ---------- */
.global-settings-card, .global-location-card {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 12px !important;
  box-shadow: var(--bem-shadow-card) !important;
}
.global-setting-row {
  background: var(--bem-surface-sub) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 10px !important;
}
.global-users-table .muted-row { opacity: .55; }

/* ---------- bottom status bar (live SSE connection / store / clock) ---------- */
.statusbar {
  background: var(--bem-surface) !important;
  border-top: 1px solid var(--bem-line) !important;
  color: var(--bem-mute) !important;
  box-shadow: 0 -1px 3px rgba(15, 23, 42, .04);
  font-weight: 600;
}
.statusbar-left, .statusbar-right { color: var(--bem-mute) !important; }
.statusbar-dot {
  background: #10b981 !important;                 /* «На связи» — зелёный */
  box-shadow: 0 0 0 3px rgba(16, 185, 129, .18) !important;
}
.statusbar-dot.offline {
  background: #ef4444 !important;                 /* «Нет связи» — красный */
  box-shadow: 0 0 0 3px rgba(239, 68, 68, .18) !important;
}

/* ---------- micro-interactions: everything should feel snappy ---------- */
.btn:active:not(:disabled),
.chip:active:not(:disabled),
.tab:active,
.marketplace-tile:active {
  transform: translateY(1px) scale(.995);
}
.btn-primary:active:not(:disabled) { box-shadow: 0 2px 6px -3px rgba(240, 88, 31, .5) !important; }
:focus-visible {
  outline: 2px solid rgba(255, 117, 71, .7) !important;
  outline-offset: 2px;
}
.progress-bar { background: var(--bem-line-soft) !important; border-radius: 999px !important; overflow: hidden; }
.progress-bar-fill {
  background: linear-gradient(90deg, #ff8358, #f0581f) !important;
  border-radius: 999px !important;
  transition: width .4s ease;
}
.tab, .nav-tab, .modal-tab { border-bottom: 2px solid transparent; transition: color .12s ease, border-color .18s ease; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:active td { background: var(--bem-coral-soft) !important; }
.pill.active, .chip.active { animation: bemFade .18s ease; }

/* loading hints get a subtle pulse so «Загрузка...» feels alive */
@keyframes bemPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.hint[style*="padding:20px"] { animation: bemPulse 1.2s ease-in-out infinite; }

/* ---------- ALL shell modals: .modal-panel had a hardcoded dark rgba(30,37,50,.96) ---------- */
.modal-panel {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 16px !important;
  box-shadow: var(--bem-shadow-pop) !important;
  color: var(--bem-ink) !important;
}
.modal-header { border-bottom: 1px solid var(--bem-line) !important; background: transparent !important; }
.modal-footer { border-top: 1px solid var(--bem-line) !important; background: transparent !important; }
.modal-title { color: var(--bem-ink) !important; }
.modal-subtitle { color: var(--bem-mute) !important; }
.preview-block {
  background: var(--bem-surface-sub) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 12px !important;
}
.preview-row { color: var(--bem-mute) !important; }
.preview-row strong, .preview-row b, .preview-row span:last-child { color: var(--bem-ink) !important; }

/* ---------- remaining hardcoded-dark blocks (employee scan screen, stats, overlays) ---------- */
.employee-workspace-overlay .modal-header {
  background: var(--bem-surface) !important;
  border-bottom: 1px solid var(--bem-line) !important;
}
.employee-workspace-overlay .scan-block {
  background: var(--bem-surface-sub) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 12px !important;
  color: var(--bem-ink) !important;
}
.employee-workspace-overlay .employee-fullscreen-btn {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  color: var(--bem-ink-2) !important;
}
.issue-overlay { background: rgba(15, 23, 42, .38) !important; }
#modal-stats .modal-panel { background: var(--bem-surface) !important; color: var(--bem-ink) !important; }
.employee-stats-v1-average-card,
.employee-stats-v1-summary-card,
.employee-stats-v1-summary-card.tone-today {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 12px !important;
  color: var(--bem-ink) !important;
  box-shadow: var(--bem-shadow-card) !important;
}
.earnings-view-tab {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  color: var(--bem-ink-2) !important;
}
.earnings-view-tab.active { border-color: var(--bem-coral) !important; color: var(--bem-coral-deep) !important; background: var(--bem-coral-soft) !important; }

/* ---------- employee coin capsule («Оплата за точность»): light bembox style ---------- */
.employee-coin-capsule {
  background: var(--bem-surface) !important;
  border: 1px solid var(--bem-line) !important;
  border-radius: 12px !important;
  box-shadow: var(--bem-shadow-card) !important;
  color: var(--bem-ink) !important;
}
.employee-coin-token {
  background: linear-gradient(180deg, #ff8358, #f0581f) !important;
  color: #fff !important;
  border: none !important;
}
.employee-coin-label { color: var(--bem-mute) !important; }
.employee-coin-balance { color: var(--bem-ink) !important; }
.employee-coin-balance span { color: var(--bem-mute) !important; }
.employee-coin-reward { color: #067647 !important; background: rgba(16, 185, 129, .12) !important; border-radius: 8px !important; }
.employee-coin-capsule.is-rewarding { border-color: #10b981 !important; box-shadow: 0 0 0 3px rgba(16, 185, 129, .15) !important; }
.employee-coin-hint.error { color: #b42318 !important; }

/* exclude-articles picker (create-assembly modal) */
.exclude-field-row { display: flex; gap: 8px; }
.exclude-field-row .input { flex: 1; min-width: 0; }
.exclude-picker-overlay { z-index: 1200; background: rgba(15, 23, 42, .45) !important; }
.exclude-picker-overlay .modal-panel { max-width: 720px; width: min(720px, 96vw); }
.exclude-picker-list { border: 1px solid var(--bem-line); border-radius: 12px; overflow: hidden; }
.exclude-picker-line {
  display: grid;
  grid-template-columns: 36px 52px minmax(0, 1fr) 110px 84px 76px;
  align-items: center;

/* ==========================================================================
   APP MODE — the site behaves like a native assembly app on tablets/phones:
   no pinch/double-tap zoom, no rubber-banding, big touch targets, fullscreen
   modals, swipeable tabs & tables. Desktop keeps the same look.
   ========================================================================== */
html {
  touch-action: pan-x pan-y;               /* blocks pinch-zoom incl. iOS */
  -webkit-text-size-adjust: 100%;
  height: 100%;
}
body {
  overscroll-behavior: none;               /* no rubber-band / pull-to-refresh */
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
.btn, .tab, .nav-tab, .chip, .pill, .modal-tab, .marketplace-tile,
.topbar button, [data-supply-tab], [data-tab], label.employee-chip {
  touch-action: manipulation;              /* kills 300ms double-tap delay */
  -webkit-user-select: none;
  user-select: none;
}

/* tabs strip: horizontal swipe, no wrap, hidden scrollbar */
.tabs, .modal-tabs {
  overflow-x: auto;
  flex-wrap: nowrap !important;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar, .modal-tabs::-webkit-scrollbar { display: none; }
.tab, .modal-tab { flex: 0 0 auto; }

/* wide tables: swipe horizontally inside the card instead of breaking layout */
.tbl { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; width: 100%; }
.tbl thead, .tbl tbody { display: table; width: 100%; table-layout: auto; }

/* the app frame itself never pans sideways — wide content scrolls inside its card */
body { overflow-x: hidden; }
#app, .main-content { max-width: 100vw; }
.main-content > *, .global-settings-stack > *, .settings-grid > *,
.modal-body > *, .card, .settings-card, .global-settings-card, .global-location-card {
  min-width: 0;
  max-width: 100%;
}

/* ---------- touch devices: comfortable tap targets ---------- */
@media (pointer: coarse) {
  .btn { min-height: 42px; padding-top: 8px; padding-bottom: 8px; }
  .btn-sm { min-height: 38px; }
  .btn-icon { min-width: 42px; min-height: 42px; }
  .chip { min-height: 38px; }
  .tab, .nav-tab { padding-top: 12px; padding-bottom: 12px; }
  .input, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select, textarea {
    min-height: 44px;
    font-size: 16px !important;            /* prevents iOS auto-zoom on focus */
  }
  ::-webkit-scrollbar { width: 0; height: 0; }  /* native-feel scroll */
}

/* ---------- tablets ≤ 1024px ---------- */
@media (max-width: 1024px) {
  .main-content { padding: 12px !important; }
  .settings-grid { grid-template-columns: 1fr !important; }
  .global-location-grid { grid-template-columns: 1fr !important; }
  .modal-panel.wide { max-width: 96vw !important; }
}

/* ---------- phones ≤ 768px: modals go fullscreen, everything stacks ---------- */
@media (max-width: 768px) {
  .topbar {
    height: auto !important;
    min-height: 48px;
    flex-wrap: wrap;
    padding: 6px 10px !important;
    gap: 6px !important;
  }
  .topbar-breadcrumb, .topbar-separator { display: none; }
  .topbar-role { display: none; }
  .main-content { padding: 10px !important; }

  .modal-overlay { padding: 0 !important; align-items: stretch !important; }
  .modal-panel, .modal-panel.wide, .modal-panel.narrow {
    width: 100vw !important;
    max-width: 100vw !important;
    height: 100dvh !important;
    max-height: 100dvh !important;
    border-radius: 0 !important;
    display: flex;
    flex-direction: column;
  }
  .modal-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-header { position: sticky; top: 0; background: var(--bem-surface); z-index: 5; }

  .marketplace-select-screen { padding: 12px !important; min-height: calc(100dvh - 48px); }
  .marketplace-select-panel { padding: 16px !important; }
  .marketplace-select-grid > .marketplace-tile { flex: 1 1 100% !important; min-height: 120px !important; }

  .login-card { padding: 22px 18px !important; }
  .statusbar { font-size: 11px; padding-left: 10px; padding-right: 10px; }
  .global-user-create { grid-template-columns: 1fr !important; }
  .global-setting-row { grid-template-columns: 1fr !important; }
  .chip-group { flex-wrap: wrap; }
  .section-header { flex-wrap: wrap; gap: 8px; }
}

/* ---------- custom dropdowns (замена нативных select по всему приложению) ---------- */
select.dd-native-hidden { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; pointer-events: none !important; margin: 0 !important; padding: 0 !important; border: 0 !important; }
